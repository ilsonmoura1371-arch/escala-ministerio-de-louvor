<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
<meta name="theme-color" content="#060c18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Escala Louvor">
<title>Escala do Louvor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, updateDoc, deleteDoc,
    doc, onSnapshot, query, where, orderBy, serverTimestamp, getDoc, setDoc, getDocs
  } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
  import {
    getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
    signOut, onAuthStateChanged, updateProfile, sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

  // Configuração pública padrão para persistência local de sessões administrativas
  const firebaseConfig = {
    apiKey: "AIzaSyABNJEfKqvbTawlgQGPoIXMvYWRmH9kCZY",
    authDomain: "louvor-escala-5d26f.firebaseapp.com",
    projectId: "louvor-escala-5d26f",
    storageBucket: "louvor-escala-5d26f.firebasestorage.app",
    messagingSenderId: "144171388952",
    appId: "1:144171388952:web:54f59fa3dd9a149ab0f36d"
  };

  const app  = initializeApp(firebaseConfig);
  const db   = getFirestore(app);
  const auth = getAuth(app);
  const col  = collection(db, "escalas");

  let scales          = [];
  let musicos         = [];
  let editDocId       = null;
  let pendingDeleteId = null;
  let usuarioLogado   = null;
  let igrejaId        = null;
  let nomeIgrejaAtual = '';
  let membroLogado    = false;
  let filtroMes = new Date().getMonth();
  let filtroAno = new Date().getFullYear();
  let unsubEscalas = null;
  let unsubMusicos = null;

  const MESES_FULL = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const MESES      = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const SEMANA     = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  const CODIGO_ATIVACAO = "LOUVOR@2026";
  const SENHA_MEMBRO_PADRAO = "1234";

  const FUNCOES = [
    { id:'vocal',     label:'Vocal Principal',   icon:'MIC' },
    { id:'back',      label:'Backing Vocals',     icon:'BACK' },
    { id:'violao',    label:'Violao',              icon:'VLO' },
    { id:'guitarra',  label:'Guitarra',           icon:'GTR' },
    { id:'teclado',   label:'Teclado',            icon:'TCL' },
    { id:'bateria',   label:'Bateria',            icon:'BAT' },
    { id:'baixo',     label:'Baixo',              icon:'BXO' },
    { id:'sax',       label:'Saxofone',           icon:'SAX' },
    { id:'percussao', label:'Percussao',          icon:'PRC' },
    { id:'som',       label:'Mesa de Som',        icon:'SOM' },
    { id:'midia',     label:'Midia/ProPresenter', icon:'MID' },
  ];

  const FUNCOES_EMOJI = {
    vocal:'🎤', back:'🎙️', violao:'🪕', guitarra:'🎸', teclado:'🎹',
    bateria:'🥁', baixo:'🎵', sax:'🎷', percussao:'🪘', som:'🎚️', midia:'🖥️'
  };

  /* ══════════════════════════════════════
      AUTH FIREBASE (LÍDER)
  ══════════════════════════════════════ */
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      usuarioLogado = user;
      igrejaId = user.uid;
      membroLogado = false;
      try {
        const snap = await getDoc(doc(db,'igrejas',user.uid));
        nomeIgrejaAtual = snap.exists() ? (snap.data().nome || user.displayName || 'Minha Igreja') : (user.displayName || 'Minha Igreja');
      } catch(e) {
        nomeIgrejaAtual = user.displayName || 'Minha Igreja';
      }
      entrarNoApp(nomeIgrejaAtual, true);
    } else if (!membroLogado) {
      usuarioLogado = null;
      mostrarTelaInicio();
    }
  });

  function safeSetDisplay(elementId, value) {
    const el = document.getElementById(elementId);
    if (el) el.style.display = value;
  }

  function mostrarTelaInicio() {
    if (unsubEscalas) { unsubEscalas(); unsubEscalas = null; }
    if (unsubMusicos) { unsubMusicos(); unsubMusicos = null; }
    if (typeof unsubCifras !== 'undefined' && unsubCifras) { unsubCifras(); unsubCifras = null; }
    safeSetDisplay('tela-inicio', 'flex');
    safeSetDisplay('tela-lider', 'none');
    safeSetDisplay('app-content', 'none');
  }

  function entrarNoApp(nomeIgreja, isLider) {
    safeSetDisplay('tela-inicio', 'none');
    safeSetDisplay('tela-lider', 'none');
    safeSetDisplay('app-content', 'block');
    
    const headerTitle = document.getElementById('nome-igreja-header');
    if (headerTitle) headerTitle.textContent = nomeIgreja || 'Ministério de Música';

    safeSetDisplay('tab-nova', isLider ? 'flex' : 'none');
    safeSetDisplay('tab-equipe', isLider ? 'flex' : 'none');
    safeSetDisplay('badge-lider', isLider ? 'inline' : 'none');
    
    const btnSair = document.getElementById('btn-sair');
    if (btnSair) btnSair.textContent = isLider ? 'Sair' : 'Trocar';

    filtroMes = new Date().getMonth();
    filtroAno = new Date().getFullYear();

    iniciarListeners();
    switchTab('escala-atual');
  }

  /* ── LOGIN LÍDER ── */
  window.mostrarTelaLider = function() {
    safeSetDisplay('tela-inicio', 'none');
    safeSetDisplay('tela-lider', 'flex');
  };

  window.voltarInicio = function() {
    safeSetDisplay('tela-lider', 'none');
    safeSetDisplay('tela-inicio', 'flex');
    safeSetDisplay('lider-erro', 'none');
  };

  window.handleAuthLider = async function(e) {
    if (e) e.preventDefault();
    const modo  = document.getElementById('lider-mode-check')?.checked;
    const email = document.getElementById('lider-email')?.value.trim();
    const senha = document.getElementById('lider-senha')?.value.trim();
    const nome  = document.getElementById('lider-nome-igreja')?.value.trim();
    const codigo= document.getElementById('lider-codigo')?.value.trim();
    const btn   = document.getElementById('btn-lider-auth');
    const erroEl = document.getElementById('lider-erro');

    if (!email || !senha) { showToast('Preencha email e senha','danger'); return; }
    if (modo && !nome)  { showToast('Informe o nome da Igreja','danger'); return; }
    if (modo && codigo !== CODIGO_ATIVACAO) {
      if (erroEl) {
        erroEl.style.display = 'block';
        erroEl.textContent = 'Codigo de ativacao invalido.';
      }
      return;
    }
    if (btn) { btn.disabled = true; btn.textContent = modo ? 'Cadastrando...' : 'Entrando...'; }
    try {
      if (modo) {
        const cred = await createUserWithEmailAndPassword(auth, email, senha);
        await updateProfile(cred.user, { displayName: nome });
        await setDoc(doc(db,'igrejas',cred.user.uid), {
          nome, senhaMembro: SENHA_MEMBRO_PADRAO, createdAt: serverTimestamp()
        });
        showToast('Igreja cadastrada!','success');
      } else {
        await signInWithEmailAndPassword(auth, email, senha);
        showToast('Bem-vindo!','success');
      }
      document.getElementById('lider-form')?.reset();
      safeSetDisplay('group-nome-lider', 'none');
    } catch(err) {
      if (erroEl) {
        erroEl.style.display = 'block';
        erroEl.textContent = err.code==='auth/email-already-in-use' ? 'Email ja cadastrado.' :
          (err.code==='auth/wrong-password'||err.code==='auth/user-not-found'||err.code==='auth/invalid-credential') ? 'Email ou senha incorretos.' :
          err.message;
      }
    } finally {
      if (btn) {
        btn.disabled = false;
        btn.textContent = modo ? 'Cadastrar Igreja' : 'Entrar como Lider';
      }
    }
  };

  window.recuperarSenha = async function() {
    const email = document.getElementById('lider-email')?.value.trim();
    if (!email) { showToast('Digite seu email primeiro','danger'); return; }
    try {
      await sendPasswordResetEmail(auth, email);
      showToast('Email de recuperacao enviado!','success');
    } catch(err) { showToast('Email nao encontrado.','danger'); }
  };

  window.toggleLiderMode = function() {
    const modo = document.getElementById('lider-mode-check')?.checked;
    safeSetDisplay('group-nome-lider', modo ? 'block' : 'none');
    safeSetDisplay('group-codigo-lider', modo ? 'block' : 'none');
    
    const titleEl = document.getElementById('lider-title');
    const btnEl = document.getElementById('btn-lider-auth');
    if (titleEl) titleEl.textContent = modo ? 'Cadastrar sua Igreja' : 'Entrar como Lider';
    if (btnEl) btnEl.textContent = modo ? 'Cadastrar Igreja' : 'Entrar como Lider';
    safeSetDisplay('lider-erro', 'none');
  };

  /* ══════════════════════════════════════
      LOGIN DO MEMBRO - TOTALMENTE SEGURO (BACKEND SERVERLESS)
  ══════════════════════════════════════ */
  window.handleAuthMembro = async function(e) {
    if (e) e.preventDefault();
    const nomeMembro = document.getElementById('membro-nome')?.value.trim();
    const senha      = document.getElementById('membro-senha')?.value.trim();
    const btn        = document.getElementById('btn-membro-auth');
    const erroEl     = document.getElementById('membro-erro');

    if (erroEl) { erroEl.style.display = 'none'; erroEl.textContent = ''; }

    if (!nomeMembro) { showToast('Digite seu nome','danger'); return; }
    if (!senha)      { showToast('Digite a senha','danger'); return; }

    if (btn) { btn.disabled = true; btn.textContent = 'Verificando...'; }

    try {
      // Faz a ponte via back-end seguro rodando no Netlify Functions
      const resposta = await fetch("/.netlify/functions/login-membro", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nomeMembro: nomeMembro, senha: senha })
      });

      const dados = await resposta.json();

      if (!resposta.ok) {
        throw new Error(dados.error || "Falha na validação dos dados de acesso.");
      }

      // Se passou na validação segura, mapeia a sessão no frontend local
      igrejaId = dados.igrejaId;
      nomeIgrejaAtual = dados.nomeIgreja;
      membroLogado = true;
      usuarioLogado = null;

      entrarNoApp(nomeIgrejaAtual, false);
      showToast('Bem-vindo, ' + dados.nome + '!', 'success');
    } catch(err) {
      if (erroEl) {
        erroEl.style.display = 'block';
        erroEl.textContent = err.message;
      }
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = 'Entrar'; }
    }
  };

  window.sair = async function() {
    if (usuarioLogado) {
      if (confirm('Deseja sair?')) { await signOut(auth); }
    } else {
      membroLogado = false; igrejaId = null; mostrarTelaInicio();
    }
  };

  window.fecharApp = async function() {
    if (confirm('Deseja sair e fechar o aplicativo?')) {
      try { if (auth.currentUser) await signOut(auth); } catch(e) {}
      membroLogado = false; igrejaId = null;
      window.close();
      window.location.href = 'about:blank';
    }
  };

  /* ══════════════════════════════════════
      LISTENERS FIRESTORE
  ══════════════════════════════════════ */
  function iniciarListeners() {
    if (!igrejaId) return;
    setStatus('connecting');
    if (unsubEscalas) unsubEscalas();
    const qE = query(col, where("igrejaId","==",igrejaId), orderBy("dataISO","asc"), orderBy("horario","asc"));
    unsubEscalas = onSnapshot(qE,
      snap => { escalas=snap.docs.map(d=>({id:d.id,...d.data()})); setStatus('online'); renderLista(); atualizarBadge(); },
      err  => { console.error(err); setStatus('error'); }
    );
    if (unsubMusicos) unsubMusicos();
    const qM = query(collection(db,'musicos'), where("igrejaId","==",igrejaId), orderBy("nome","asc"));
    unsubMusicos = onSnapshot(qM,
      snap => { musicos=snap.docs.map(d=>({id:d.id,...d.data()})); renderEquipe(); verificarAniversarios(); },
      err  => console.error(err)
    );
    setTimeout(()=>{ if(typeof iniciarListenerCifras==='function') iniciarListenerCifras(); },0);
  }

  function setStatus(s) {
    const el=document.getElementById('status-dot'), tx=document.getElementById('status-text');
    if(el&&tx){ el.className='status-dot '+s; tx.textContent=s==='online'?'Ao vivo':s==='connecting'?'Conectando...':'Desconectado'; }
  }

  function isLider() {
    return usuarioLogado !== null && !membroLogado;
  }

  /* O resto das suas funções de renderização (renderLista, switchTab, etc.) continuam aqui embaixo de forma idêntica... */
</script>
</head>
<body>
  </body>
</html>
