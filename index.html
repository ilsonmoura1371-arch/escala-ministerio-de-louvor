<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <meta name="theme-color" content="#0f172a">
  <title>Escala do Louvor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <script type="module">
    try {
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
      import { getFirestore, collection, addDoc, updateDoc, doc, onSnapshot, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
      import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyABNJEfKqvbTawlgQGPoIXMvYWRmH9kCZY",
        authDomain: "louvor-escala-5d26f.firebaseapp.com",
        projectId: "louvor-escala-5d26f",
        storageBucket: "louvor-escala-5d26f.firebasestorage.app",
        messagingSenderId: "144171388952",
        appId: "1:144171388952:web:54f59fa3dd9a149ab0f36d"
      };

      const app  = initializeApp(firebaseConfig);
      const db   = getFirestore(app);
      const auth = getAuth(app);
      const col  = collection(db, "escalas");

      let escalas = [];
      let usuarioLogado = null;
      let unsubscribeLista = null;
      let currentEditCardId = null;
      
      // Lista dinâmica de funções adicionadas no formulário atual
      let funcoesSelecionadas = [];

      const DICIONARIO_FUNCOES = {
        vocal: { label: "🎤 Vocal Principal", icon: "🎤" },
        back: { label: "👥 Backing Vocal", icon: "👥" },
        violao: { label: "🎸 Violão", icon: "🎸" },
        guitarra: { label: "🎸 Guitarra", icon: "🎸" },
        baixo: { label: "🎸 Baixo", icon: "🎸" },
        bateria: { label: "🥁 Bateria", icon: "🥁" },
        teclado: { label: "🎹 Teclado", icon: "🎹" },
        sax: { label: "🎷 Sax", icon: "🎷" },
        flauta: { label: "🎵 Flauta", icon: "🎵" },
        pandeiro: { label: "🪘 Pandeiro", icon: "🪘" },
        percurssao: { label: "🪘 Percussão", icon: "🪘" },
        mesa: { label: "🎛️ Mesa de Som", icon: "🎛️" },
        computador: { label: "💻 Computador", icon: "💻" }
      };

      const IGREJA_PADRAO_ID = "pM7gN1R4GgVlGvExAmPlO1D2EsA3"; 
      let nomeIgrejaAtual = "Minha Igreja";

      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById('public-screen').style.display = 'block';
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'none';
        carregarEscalasPublicas();
        renderBotoesSelecaoFuncao();
      });

      onAuthStateChanged(auth, (user) => {
        if (user) {
          usuarioLogado = user;
          nomeIgrejaAtual = user.displayName || "Minha Igreja";
          document.getElementById('auth-screen').style.display = 'none';
          document.getElementById('public-screen').style.display = 'none';
          document.getElementById('admin-panel').style.display = 'block';
          atualizarNomesIgreja(nomeIgrejaAtual);
          iniciarListenerAdmin();
        } else {
          usuarioLogado = null;
          if (unsubscribeLista) { unsubscribeLista(); unsubscribeLista = null; }
          document.getElementById('admin-panel').style.display = 'none';
          document.getElementById('auth-screen').style.display = 'none';
          document.getElementById('public-screen').style.display = 'block';
          carregarEscalasPublicas();
        }
      });

      function atualizarNomesIgreja(nome) {
        document.getElementById('nome-igreja-header-admin').textContent = "Ministério de Louvor - " + nome;
        document.getElementById('nome-igreja-header-publico').textContent = "Ministério de Louvor";
        document.getElementById('sub-igreja-publico').textContent = nome;
      }

      async function carregarEscalasPublicas() {
        const targetId = usuarioLogado ? usuarioLogado.uid : IGREJA_PADRAO_ID;
        const q = query(col, where("igrejaId", "in", [targetId, "geral"]), orderBy("dataISO", "asc"), orderBy("horario", "asc"));
        
        if (unsubscribeLista) unsubscribeLista();
        unsubscribeLista = onSnapshot(q, (snapshot) => {
          escalas = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          if(escalas.length > 0 && !usuarioLogado && farmIgrejaName(escalas[0])) {
             atualizarNomesIgreja(farmIgrejaName(escalas[0]));
          }
          renderLista('lista-escalas-publica', false);
        }, (error) => {
          const qSimples = query(col, orderBy("dataISO", "asc"));
          onSnapshot(qSimples, (snapshot) => {
            escalas = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
            renderLista('lista-escalas-publica', false);
          });
        });
      }

      function farmIgrejaName(escalaItem) {
         return usuarioLogado ? usuarioLogado.displayName : "Sua Congregação";
      }

      function iniciarListenerAdmin() {
        if (!usuarioLogado) return;
        const q = query(col, where("igrejaId", "==", usuarioLogado.uid), orderBy("dataISO", "asc"), orderBy("horario", "asc"));
        if (unsubscribeLista) unsubscribeLista();
        unsubscribeLista = onSnapshot(q, (snapshot) => {
          escalas = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          renderLista('lista-escalas-admin', true);
        });
      }

      window.handleAuth = async function(e) {
        if (e) e.preventDefault();
        const modoCadastro = document.getElementById('auth-mode-check').checked;
        const email = document.getElementById('auth-email').value.trim();
        const senha = document.getElementById('auth-senha').value.trim();
        const nomeIgreja = document.getElementById('auth-nome-igreja').value.trim();
        const btn = document.getElementById('btn-auth');

        if (!email || !senha) { showToast('⚠️ Preencha os campos', 'danger'); return; }
        btn.disabled = true;

        try {
          if (modoCadastro) {
            const userCredential = await createUserWithEmailAndPassword(auth, email, senha);
            await updateProfile(userCredential.user, { displayName: nomeIgreja });
            showToast('✓ Ministério cadastrado!', 'success');
          } else {
            await signInWithEmailAndPassword(auth, email, senha);
            showToast('✓ Bem-vindo!', 'success');
          }
        } catch (error) {
          showToast('❌ Verifique os dados.', 'danger');
        } finally {
          btn.disabled = false;
        }
      };

      window.logout = async function() {
        if (confirm('Deseja sair do painel administrativo?')) { await signOut(auth); }
      };

      window.toggleAuthMode = function() {
        const modoCadastro = document.getElementById('auth-mode-check').checked;
        document.getElementById('group-nome-igreja').style.display = modoCadastro ? 'block' : 'none';
        document.getElementById('btn-auth').textContent = modoCadastro ? 'Criar Conta do Ministério' : 'Entrar no Painel';
      };

      window.showLoginScreen = function() {
        document.getElementById('public-screen').style.display = 'none';
        document.getElementById('auth-screen').style.display = 'flex';
      };

      window.voltarParaPublico = function() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('public-screen').style.display = 'block';
      };

      window.switchTab = function(tab) {
        document.getElementById('panel-lista').classList.toggle('active', tab === 'lista');
        document.getElementById('panel-form').classList.toggle('active',  tab === 'form');
        document.getElementById('tab-lista').classList.toggle('active',   tab === 'lista');
        document.getElementById('tab-form').classList.toggle('active',    tab === 'form');
      };

      // Gerenciador de funções adicionadas dinamicamente no painel do administrador
      function renderBotoesSelecaoFuncao() {
        const container = document.getElementById('botoes-seletor-funcoes');
        if(!container) return;
        container.innerHTML = Object.keys(DICIONARIO_FUNCOES).map(key => {
          return `<button type="button" class="btn-add-funcao" onclick="adicionarFuncaoAoFormulario('${key}')">${DICIONARIO_FUNCOES[key].label}</button>`;
        }).join('');
      }

      window.adicionarFuncaoAoFormulario = function(key) {
        // Gera um ID temporário único para controle de exclusão na tela
        const idTemp = Date.now() + Math.random().toString(36).substr(2, 5);
        funcoesSelecionadas.push({
          idTemp: idTemp,
          tipo: key,
          label: DICIONARIO_FUNCOES[key].label,
          icon: DICIONARIO_FUNCOES[key].icon,
          integrante: ""
        });
        renderCamposFuncoesAtivas();
      };

      window.removerFuncaoDoFormulario = function(idTemp) {
        funcoesSelecionadas = funcoesSelecionadas.filter(f => f.idTemp !== idTemp);
        renderCamposFuncoesAtivas();
      };

      window.atualizarNomeIntegrante = function(idTemp, valor) {
        const f = funcoesSelecionadas.find(item => item.idTemp === idTemp);
        if(f) f.integrante = valor;
      };

      function renderCamposFuncoesAtivas() {
        const container = document.getElementById('campos-funcoes-dinamicas');
        if(!container) return;
        if(funcoesSelecionadas.length === 0) {
          container.innerHTML = `<p style="font-size:13px; color:var(--text-muted); font-style:italic;">Nenhum integrante ou instrumento adicionado. Clique nos botões acima para montar a equipe.</p>`;
          return;
        }
        container.innerHTML = funcoesSelecionadas.map(f => {
          return `
            <div class="row-funcao-ativa">
              <span class="lbl-funcao-ativa">${f.label}:</span>
              <input type="text" placeholder="Nome do voluntário" value="${f.integrante}" oninput="atualizarNomeIntegrante('${f.idTemp}', this.value)">
              <button type="button" class="btn-remove-funcao" onclick="removerFuncaoDoFormulario('${f.idTemp}')">❌ Remover</button>
            </div>
          `;
        }).join('');
      }

      window.abrirModalMusicas = function(id) {
        currentEditCardId = id;
        const escala = escalas.find(e => e.id === id);
        if (escala) {
          document.getElementById('modal-hinos').value = escala.hinos || '';
          document.getElementById('modal-links').value = escala.links || '';
          document.getElementById('musica-modal').style.display = 'flex';
        }
      };

      window.fecharModal = function() {
        document.getElementById('musica-modal').style.display = 'none';
        currentEditCardId = null;
      };

      window.salvarMusicasVocal = async function() {
        if (!currentEditCardId) return;
        const hinos = document.getElementById('modal-hinos').value.trim();
        const links = document.getElementById('modal-links').value.trim();
        const btn = document.getElementById('btn-salvar-modal');

        btn.disabled = true;
        try {
          await updateDoc(doc(db, "escalas", currentEditCardId), { hinos, links, updatedAt: serverTimestamp() });
          showToast('✓ Repertório atualizado!', 'success');
          fecharModal();
        } catch (error) {
          showToast('❌ Erro ao atualizar.', 'danger');
        } finally {
          btn.disabled = false;
        }
      };

      window.salvar = async function() {
        const data    = document.getElementById('data').value.trim();
        const horario = document.getElementById('horario').value.trim();
        const recados = document.getElementById('recados').value.trim();

        if (!data || !horario) { showToast('⚠️ Escolha data e horário', 'danger'); return; }
        if (funcoesSelecionadas.length === 0) { showToast('⚠️ Adicione pelo menos um integrante na escala', 'danger'); return; }

        const btn = document.getElementById('btn-salvar');
        btn.disabled = true;

        const obj = { 
          dataISO: data, 
          horario, 
          equipeMembros: funcoesSelecionadas.map(f => ({ tipo: f.tipo, label: f.label, icon: f.icon, integrante: f.integrante })),
          hinos: "", 
          links: "", 
          recados, 
          igrejaId: usuarioLogado.uid, 
          updatedAt: serverTimestamp() 
        };

        try {
          obj.createdAt = serverTimestamp();
          await addDoc(col, obj);
          showToast('✓ Nova escala criada!', 'success');
          document.getElementById('data').value = '';
          document.getElementById('horario').value = '';
          document.getElementById('recados').value = '';
          funcoesSelecionadas = [];
          renderCamposFuncoesAtivas();
          switchTab('lista');
        } catch (e) {
          showToast('❌ Erro ao salvar dados.', 'danger');
        } finally {
          btn.disabled = false;
        }
      };

      function renderLista(containerId, isAdmin = false) {
        const container = document.getElementById(containerId);
        if (!container) return;
        if (escalas.length === 0) {
          container.innerHTML = `<div class="empty-state"><h3>Nenhuma escala agendada</h3><p>As escalas e ensaios criados pelo líder aparecerão nesta área.</p></div>`;
          return;
        }
        container.innerHTML = escalas.map(e => {
          const [ano, mes, dia] = e.dataISO.split('-');
          
          let equipeHtml = "";
          if (e.equipeMembros && e.equipeMembros.length > 0) {
            equipeHtml = e.equipeMembros.map(m => `
              <div class="team-row"><span class="team-label">${m.label}:</span> <span class="team-value">${m.integrante || 'A definir'}</span></div>
            `).join('');
          } else {
            // Compatibilidade com registros antigos antigos se houver
            equipeHtml = `
              <div class="team-row"><span class="team-label">🎸 Direção / Banda:</span> <span class="team-value">${e.lider || 'Não definido'}</span></div>
              <div class="team-row"><span class="team-label">🎤 Vocal Principal:</span> <span class="team-value">${e.vocal || 'Não definido'}</span></div>
            `;
          }

          return `
            <div class="louve-card">
              <div class="louve-card-edge"></div>
              <div class="louve-card-content">
                <div class="louve-meta">
                  <span class="badge-date">📅 ${dia}/${mes}/${ano}</span>
                  <span class="badge-time">🕐 ${e.horario}h</span>
                </div>
                
                <div class="team-section">
                  ${equipeHtml}
                </div>

                <div class="songs-box">
                  <div class="box-header-action">
                    <span class="box-title">🎵 Repertório e Links</span>
                    ${!isAdmin ? `<button class="btn-action-sm" onclick="abrirModalMusicas('${e.id}')">✏️ Alimentar Repertório</button>` : ''}
                  </div>
                  <div class="box-text">${e.hinos ? e.hinos.replace(/\n/g, '<br>') : '<span style="color:var(--text-muted); font-style:italic;">Nenhuma música listada. Toque no botão acima para incluir.</span>'}</div>
                  
                  ${e.links ? `
                  <div class="links-area" style="margin-top:10px; padding-top:10px; border-top:1px dashed rgba(16, 185, 129, 0.2);">
                    <div class="box-title" style="font-size:11px; color:#10b981;">🔗 Links de Estudo:</div>
                    <div class="box-text" style="word-break: break-all; color:#38bdf8;">${e.links.replace(/\n/g, '<br>')}</div>
                  </div>` : ''}
                </div>

                ${e.recados ? `
                <div class="alert-box">
                  <div class="box-title">⚠️ Orientações e Ensaios</div>
                  <div class="box-text">${e.recados.replace(/\n/g, '<br>')}</div>
                </div>` : ''}
              </div>
            </div>`;
        }).join('');
      }

      let toastTimer;
      window.showToast = function(msg, tipo = '') {
        const el = document.getElementById('toast');
        if(!el) return;
        el.innerHTML = msg; el.className = 'toast ' + tipo;
        clearTimeout(toastTimer); el.classList.add('show');
        toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
      };

    } catch (error) {
      console.error(error);
    }
  </script>

  <style>
    :root {
      --bg-dark: #0f172a; --bg-card: #1e293b; --bg-input: #334155;
      --primary: #38bdf8; --primary-hover: #0ea5e9; --text-white: #f8fafc;
      --text-muted: #94a3b8; --border: #334155; --radius: 14px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg-dark); color: var(--text-white); min-height: 100vh; -webkit-font-smoothing: antialiased; }
    
    .main { padding: 16px; max-width: 540px; margin: 0 auto; padding-bottom: 80px; }
    
    /* Página de Boas Vindas Pública */
    .welcome-container { background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%); padding: 30px 20px; text-align: center; border-radius: 0 0 24px 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .welcome-container h1 { font-size: 24px; font-weight: 700; color: white; margin-bottom: 6px; }
    .welcome-container p { font-size: 15px; color: var(--primary); font-weight: 500; }
    .welcome-intro-box { background: rgba(255,255,255,0.05); padding: 14px; border-radius: 10px; margin-top: 14px; font-size: 13px; color: #cbd5e1; line-height: 1.5; border: 1px solid rgba(255,255,255,0.05); }

    /* Seletor Dinâmico de Funções no Administrador */
    .seletor-botoes-container { display: flex; flex-wrap: wrap; gap: 8px; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 16px; }
    .btn-add-funcao { background: var(--bg-input); border: 1px solid var(--border); color: white; padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .btn-add-funcao:hover { border-color: var(--primary); background: rgba(56, 189, 248, 0.1); }
    
    .row-funcao-ativa { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.02); padding: 10px; border-radius: 8px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.05); }
    .lbl-funcao-ativa { font-size: 13px; font-weight: 700; color: var(--primary); width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-funcao-ativa input { flex: 1; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; color: white; font-size: 14px; }
    .btn-remove-funcao { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #ef4444; padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .btn-remove-funcao:hover { background: #ef4444; color: white; }

    /* Cards e Listagens */
    .louve-card { background: var(--bg-card); border-radius: var(--radius); margin-bottom: 20px; overflow: hidden; display: flex; box-shadow: 0 8px 16px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.03); }
    .louve-card-edge { width: 6px; background: var(--primary); }
    .louve-card-content { flex: 1; padding: 20px; }
    
    .louve-meta { display: flex; gap: 10px; margin-bottom: 16px; }
    .badge-date { background: rgba(56, 189, 248, 0.15); color: var(--primary); padding: 6px 12px; border-radius: 50px; font-size: 13px; font-weight: 700; }
    .badge-time { background: rgba(255, 255, 255, 0.08); color: white; padding: 6px 12px; border-radius: 50px; font-size: 13px; font-weight: 700; }
    
    .team-section { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; background: rgba(0,0,0,0.15); padding: 14px; border-radius: 8px; }
    .team-row { display: flex; flex-direction: column; gap: 2px; }
    .team-label { font-size: 11px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; }
    .team-value { font-size: 15px; color: var(--text-white); font-weight: 700; }
    
    .songs-box, .alert-box { border-radius: 8px; padding: 14px; margin-top: 12px; border-left: 3px solid; }
    .songs-box { background: rgba(16, 185, 129, 0.08); border-left-color: #10b981; }
    .alert-box { background: rgba(245, 158, 11, 0.08); border-left-color: #f59e0b; }
    
    .box-header-action { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 10px; }
    .box-title { font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .songs-box .box-title { color: #10b981; }
    .alert-box .box-title { color: #f59e0b; }
    .box-text { font-size: 14px; line-height: 1.5; color: #e2e8f0; }

    .btn-action-sm { background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #10b981; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; }

    /* Modal Estilo Popup */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; z-index: 10000; padding: 16px; }
    .modal-body { background: var(--bg-card); width: 100%; max-width: 460px; border-radius: var(--radius); padding: 24px; border: 1px solid var(--border); }
    .modal-body h3 { font-size: 18px; margin-bottom: 16px; color: white; }

    .footer-access { text-align: center; padding: 20px; margin-top: 20px; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 10px 20px; border-radius: 30px; cursor: pointer; font-size: 13px; font-weight: 500; }

    /* Login & Admin Layouts */
    .auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: radial-gradient(circle at top, #1e3a8a 0%, #0f172a 100%); }
    .auth-card { background: var(--bg-card); width: 100%; max-width: 420px; border-radius: var(--radius); padding: 32px 24px; }
    .auth-card h2 { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 24px; }
    
    .switch-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 24px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; font-size: 14px; }
    .field-group { margin-bottom: 16px; }
    .field-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-muted); }
    .field-group input, .field-group textarea { width: 100%; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; padding: 14px; font-size: 16px; color: white; outline: none; }
    
    .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; text-align: center; }
    .btn-primary { background: var(--primary); color: #0f172a; }
