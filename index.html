<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Escala Louvor">

<meta property="og:type" content="website">
<meta property="og:title" content="Escala do Louvor">
<meta property="og:description" content="Acesse a escala do ministério de música.">
<meta property="og:image" content="guitarra-512.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">

<title>Escala do Louvor</title>

<link rel="manifest" href="manifest2.json">
<link rel="apple-touch-icon" sizes="144x144" href="guitarra-144.png">
<link rel="apple-touch-icon" sizes="192x192" href="guitarra-192.png">
<link rel="icon" type="image/png" sizes="48x48" href="guitarra-48.png">
<link rel="icon" type="image/png" sizes="96x96" href="guitarra-96.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, updateDoc, deleteDoc,
    doc, onSnapshot, query, where, orderBy, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
  import { 
    getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, 
    signOut, onAuthStateChanged, updateProfile 
  } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyABNJEfKqvbTawlgQGPoIXMvYWRmH9kCZY",
    authDomain: "louvor-escala-5d26f.firebaseapp.com",
    projectId: "louvor-escala-5d26f",
    storageBucket: "louvor-escala-5d26f.firebasestorage.app",
    messagingSenderId: "144171388952",
    appId: "1:144171388952:web:54f59fa3dd9a149ab0f36d"
  };

  const app  = initializeApp(firebaseConfig);
  const db   = getFirestore(app);
  const auth = getAuth(app);
  const col  = collection(db, "escalas");

  let escalas         = [];
  let editDocId       = null;
  let pendingDeleteId = null;
  let usuarioLogado   = null;
  let unsubscribeLista = null;

  const MESES  = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const SEMANA = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];

  // Monitora o estado de login do usuário
  onAuthStateChanged(auth, (user) => {
    if (user) {
      usuarioLogado = user;
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app-content').style.display = 'block';
      document.getElementById('nome-igreja-header').textContent = user.displayName || "Minha Igreja";
      iniciarListener();
    } else {
      usuarioLogado = null;
      if (unsubscribeLista) { unsubscribeLista(); unsubscribeLista = null; }
      document.getElementById('app-content').style.display = 'none';
      document.getElementById('auth-screen').style.display = 'flex';
      setStatus('offline');
    }
  });

  function iniciarListener() {
    if (!usuarioLogado) return;
    setStatus('connecting');
    
    // Filtra buscando apenas as escalas pertencentes à igreja logada
    const q = query(
      col, 
      where("igrejaId", "==", usuarioLogado.uid),
      orderBy("dataISO", "asc"), 
      orderBy("horario", "asc")
    );

    if (unsubscribeLista) unsubscribeLista();

    unsubscribeLista = onSnapshot(q,
      (snapshot) => {
        escalas = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        setStatus('online');
        renderLista();
        atualizarBadge();
      },
      (error) => { 
        console.error(error); 
        setStatus('error'); 
        showToast('Erro ao carregar dados do banco.', 'danger');
      }
    );
  }

  function setStatus(s) {
    const el = document.getElementById('status-dot');
    const tx = document.getElementById('status-text');
    if (el && tx) {
      el.className = 'status-dot ' + s;
      tx.textContent = s === 'online' ? 'Ao vivo' : s === 'connecting' ? 'Conectando...' : 'Desconectado';
    }
  }

  // Ações de Autenticação
  window.handleAuth = async function(e) {
    if (e) e.preventDefault();
    const modoCadastro = document.getElementById('auth-mode-check').checked;
    const email = document.getElementById('auth-email').value.trim();
    const senha = document.getElementById('auth-senha').value.trim();
    const nomeIgreja = document.getElementById('auth-nome-igreja').value.trim();
    const btn = document.getElementById('btn-auth');

    if (!email || !senha) { showToast('⚠️ Preencha email e senha', 'danger'); return; }
    if (modoCadastro && !nomeIgreja) { showToast('⚠️ Informe o nome da Igreja', 'danger'); return; }

    btn.disabled = true;
    btn.textContent = modoCadastro ? 'Criando Igreja...' : 'Entrando...';

    try {
      if (modoCadastro) {
        const userCredential = await createUserWithEmailAndPassword(auth, email, senha);
        await updateProfile(userCredential.user, { displayName: nomeIgreja });
        showToast('✓ Igreja cadastrada com sucesso!', 'success');
        document.getElementById('nome-igreja-header').textContent = nomeIgreja;
      } else {
        await signInWithEmailAndPassword(auth, email, senha);
        showToast('✓ Bem-vindo de volta!', 'success');
      }
      document.getElementById('auth-form-element').reset();
    } catch (error) {
      console.error(error);
      if (error.code === 'auth/email-already-in-use') showToast('❌ Este email já está cadastrado.', 'danger');
      else if (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') showToast('❌ Email ou senha incorretos.', 'danger');
      else showToast('❌ Falha na autenticação: ' + error.message, 'danger');
    } finally {
      btn.disabled = false;
      btn.textContent = modoCadastro ? 'Cadastrar Nova Igreja' : 'Entrar no Painel';
    }
  };

  window.logout = async function() {
    if (confirm('Deseja realmente sair do painel de administração?')) {
      try {
        await signOut(auth);
        showToast('Desconectado com sucesso', 'success');
      } catch (e) { showToast('Erro ao deslogar', 'danger'); }
    }
  };

  window.toggleAuthMode = function() {
    const modoCadastro = document.getElementById('auth-mode-check').checked;
    document.getElementById('group-nome-igreja').style.display = modoCadastro ? 'block' : 'none';
    document.getElementById('auth-title').textContent = modoCadastro ? 'Cadastrar sua Igreja' : 'Painel do Administrador';
    document.getElementById('btn-auth').textContent = modoCadastro ? 'Cadastrar Nova Igreja' : 'Entrar no Painel';
  };

  window.switchTab = function(tab) {
    document.getElementById('panel-form').classList.toggle('active',  tab === 'form');
    document.getElementById('panel-lista').classList.toggle('active', tab === 'lista');
    document.getElementById('tab-form').classList.toggle('active',    tab === 'form');
    document.getElementById('tab-lista').classList.toggle('active',   tab === 'lista');
  };

  let toastTimer;
  window.showToast = function(msg, tipo = '') {
    const el = document.getElementById('toast');
    el.innerHTML = msg;
    el.className = 'toast ' + tipo;
    clearTimeout(toastTimer);
    el.classList.add('show');
    toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
  };

  window.resetForm = function() {
    editDocId = null;
    ['data','horario','vocal','back','hinos','links','recados'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
    document.getElementById('form-title-text').textContent = 'Agendar nova data';
    document.getElementById('btn-salvar').textContent = 'Salvar na Escala';
    document.getElementById('btn-cancelar').classList.remove('visible');
    document.getElementById('btn-salvar').disabled = false;
  };

  window.salvar = async function() {
    const data    = document.getElementById('data').value.trim();
    const horario = document.getElementById('horario').value.trim();
    const vocal   = document.getElementById('vocal').value.trim();
    const back    = document.getElementById('back').value.trim();
    const hinos   = document.getElementById('hinos').value.trim();
    const links   = document.getElementById('links').value.trim();
    const recados = document.getElementById('recados').value.trim();

    if (!data)    { showToast('⚠️ Informe a data',            'danger'); document.getElementById('data').focus();    return; }
    if (!horario) { showToast('⚠️ Informe o horário',         'danger'); document.getElementById('horario').focus(); return; }
    if (!vocal)   { showToast('⚠️ Informe o vocal principal', 'danger'); document.getElementById('vocal').focus();   return; }
    if (!back)    { showToast('⚠️ Informe os backing vocals', 'danger'); document.getElementById('back').focus();    return; }
    if (!usuarioLogado) { showToast('⚠️ Sessão expirada. Faça login novamente.', 'danger'); return; }

    const btn = document.getElementById('btn-salvar');
    btn.disabled = true;
    btn.textContent = 'Salvando...';

    // Salvando o registro atrelado à ID única da Igreja logada
    const obj = { 
      dataISO: data, 
      horario, 
      vocal, 
      back, 
      hinos, 
      links, 
      recados, 
      igrejaId: usuarioLogado.uid,
      updatedAt: serverTimestamp() 
    };

    try {
      if (editDocId) {
        await updateDoc(doc(db, "escalas", editDocId), obj);
        showToast('✓ Escala atualizada', 'success');
      } else {
        obj.createdAt = serverTimestamp();
        await addDoc(col, obj);
        showToast('✓ Escala salva', 'success');
      }
      resetForm();
      switchTab('lista');
    } catch (e) {
      console.error(e);
      showToast('❌ Erro ao salvar. Verifique as regras do banco.', 'danger');
      btn.disabled = false;
      btn.textContent = editDocId ? 'Atualizar Escala' : 'Salvar na Escala';
    }
  };

  window.salvarApenasRecado = async function(id) {
    const textarea = document.getElementById('recado-input-' + id);
    if (!textarea) return;
    const novoRecado = textarea.value.trim();
    const btn = document.getElementById('btn-recado-' + id);
    if (btn) { btn.disabled = true; btn.textContent = 'Salvando...'; }
    try {
      await updateDoc(doc(db, "escalas", id), { recados: novoRecado, updatedAt: serverTimestamp() });
      showToast('💬 Recado atualizado!', 'success');
    } catch (e) {
      console.error(e);
      showToast('❌ Erro ao salvar recado.', 'danger');
    }
    if (btn) { btn.disabled = false; btn.textContent = '💾 Salvar Recado'; }
  };

  window.editarEscala = function(id) {
    const e = escalas.find(x => x.id === id);
    if (!e) return;
    editDocId = id;
    document.getElementById('data').value    = e.dataISO;
    document.getElementById('horario').value = e.horario;
    document.getElementById('vocal').value   = e.vocal;
    document.getElementById('back').value    = e.back;
    document.getElementById('hinos').value   = e.hinos  || '';
    document.getElementById('links').value   = e.links  || '';
    document.getElementById('recados').value = e.recados|| '';
    document.getElementById('form-title-text').textContent = 'Editar / Substituir escala';
    document.getElementById('btn-salvar').textContent = 'Atualizar Escala';
    document.getElementById('btn-cancelar').classList.add('visible');
    switchTab('form');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  window.abrirDialog = function(id) {
    pendingDeleteId = id;
    const e = escalas.find(x => x.id === id);
    if (!e) return;
    const [ano, mes, dia] = e.dataISO.split('-');
    document.getElementById('dialog-desc').textContent =
      `Você vai remover a escala do dia ${dia}/${mes}/${ano} às ${e.horario}. Esta ação não pode ser desfeita.`;
    document.getElementById('overlay').classList.add('active');
  };

  window.fecharDialog = function(e) {
    if (e && e.target !== document.getElementById('overlay')) return;
    document.getElementById('overlay').classList.remove('active');
    pendingDeleteId = null;
  };

  window.confirmarExclusao = async function() {
    if (!pendingDeleteId) return;
    const btn = document.querySelector('.btn-dialog-confirm');
    btn.textContent = 'Removendo...'; btn.disabled = true;
    try {
      await deleteDoc(doc(db, "escalas", pendingDeleteId));
      if (editDocId === pendingDeleteId) resetForm();
      showToast('🗑 Escala removida', 'danger');
    } catch (e) { showToast('❌ Erro ao remover', 'danger'); }
    btn.textContent = 'Remover'; btn.disabled = false;
    document.getElementById('overlay').classList.remove('active');
    pendingDeleteId = null;
  };

  function atualizarBadge() {
    const el = document.getElementById('badge-count');
    if (el) {
      el.textContent = escalas.length;
      el.style.display = escalas.length > 0 ? 'inline-flex' : 'none';
    }
  }

  function calcDiasBadge(dataISO) {
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const d    = new Date(dataISO + 'T00:00:00');
    const diff = Math.round((d - hoje) / 86400000);
    if (diff === 0)            return { label: 'Hoje',                     cls: 'hoje'   };
    if (diff === 1)            return { label: 'Amanhã',                    cls: 'breve'  };
    if (diff > 1 && diff <= 7) return { label: `Em ${diff} dias`,          cls: 'breve'  };
    if (diff > 7)              return { label: `Em ${diff} dias`,           cls: 'normal' };
    if (diff === -1)           return { label: 'Ontem',                     cls: 'passado'};
    return                             { label: `Há ${Math.abs(diff)} dias`, cls: 'passado'};
  }

  function formatarLinksHtml(textoLinks) {
    if (!textoLinks || !textoLinks.trim()) {
      return '<span class="sem-conteudo">Nenhum link adicionado</span>';
    }
    const linhas = textoLinks.trim().split('\n');
    return linhas.map(linha => {
      linha = inlineEsc(linha.trim());
      if (!linha) return '';
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      const temUrl = urlRegex.test(linha);
      urlRegex.lastIndex = 0;
      if (temUrl) {
        return '<div class="link-item">' +
          linha.replace(urlRegex, url =>
            `<a href="${url}" target="_blank" rel="noopener noreferrer" class="musica-link">` +
            `<span class="link-icon">▶</span> Ouvir / Assistir</a>`) +
          '</div>';
      }
      return `<div class="link-item link-texto">${linha}</div>`;
    }).filter(Boolean).join('');
  }

  function inlineEsc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function renderLista() {
    const container = document.getElementById('lista-escalas');
    if (!container) return;

    if (escalas.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🎶</div>
          <h3>Nenhuma escala ainda</h3>
          <p>Toque em "Nova Escala" para<br>começar a organizar a equipe.</p>
        </div>`;
      return;
    }

    const html = escalas.map(e => {
      const [ano, mes, dia] = e.dataISO.split('-');
      const dataBR    = `${dia}/${mes}/${ano}`;
      const mesAbrev  = MESES[parseInt(mes) - 1];
      const diaSemana = SEMANA[new Date(e.dataISO + 'T00:00:00').getDay()];
      const badge     = calcDiasBadge(e.dataISO);

      const hinosExibicao = e.hinos
        ? `<div class="hinos-lista" style="white-space:pre-wrap;">${esc(e.hinos)}</div>`
        : '<span class="sem-conteudo">Nenhum hino adicionado</span>';

      const linksHtml  = formatarLinksHtml(e.links);
      const recadoVal  = e.recados || '';
      const temRecado  = recadoVal.trim().length > 0;

      return `
        <div class="escala-card">
          <div class="escala-card-header">
            <div class="escala-date-block">
              <div class="escala-date-num">
                <span class="day">${dia}</span>
                <span class="month">${mesAbrev}</span>
              </div>
              <div class="escala-date-info">
                <span class="escala-date-full">${diaSemana}, ${dataBR}</span>
                <span class="escala-time-badge">🕐 ${e.horario}</span>
              </div>
            </div>
            <span class="dias-badge ${badge.cls}">${badge.label}</span>
          </div>

          <div class="escala-card-body">
            <div class="escala-row">
              <span class="escala-row-icon">🎤</span>
              <div class="escala-row-content">
                <div class="escala-row-label">Vocal Principal</div>
                <div class="escala-row-value">${esc(e.vocal)}</div>
              </div>
            </div>

            <div class="escala-row">
              <span class="escala-row-icon">👥</span>
              <div class="escala-row-content">
                <div class="escala-row-label">Backing Vocals</div>
                <div class="escala-row-value">${esc(e.back)}</div>
              </div>
            </div>

            <div class="escala-row">
              <span class="escala-row-icon">🎵</span>
              <div class="escala-row-content">
                <div class="escala-row-label-hinos">Hinos do Dia</div>
                <div class="escala-row-value-hinos">${hinosExibicao}</div>
              </div>
            </div>

            <div class="escala-row">
              <span class="escala-row-icon">🔗</span>
              <div class="escala-row-content">
                <div class="escala-row-label-links">Links das Músicas</div>
                <div class="links-container">${linksHtml}</div>
              </div>
            </div>

            <div class="recados-section">
              <div class="recados-header">
                <span class="recados-icon">📢</span>
                <span class="recados-title">Avisos &amp; Justificativas</span>
                ${temRecado ? `<span class="recados-badge">Há mensagem</span>` : ''}
              </div>
              ${temRecado ? `<div class="recado-exibido">${esc(recadoVal)}</div>` : ''}
              <textarea
                id="recado-input-${e.id}"
                class="recado-textarea"
                placeholder="Deixe aqui seu aviso ou justificativa de ausência&#10;Ex: Não poderei ir este domingo — João"
              >${esc(recadoVal)}</textarea>
              <button
                id="btn-recado-${e.id}"
                class="btn-salvar-recado"
                onclick="salvarApenasRecado('${e.id}')">
                💾 Salvar Recado
              </button>
            </div>
          </div>

          <div class="escala-card-footer">
            <button class="btn-edit-card" onclick="editarEscala('${e.id}')">✏️ Editar</button>
            <button class="btn-del-card"  onclick="abrirDialog('${e.id}')">🗑 Excluir</button>
          </div>
        </div>`;
    }).join('');

    container.innerHTML = `<div class="escala-list">${html}</div>`;
  }

  function esc(str) {
    return String(str || '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js')
        .then(reg => console.log('PWA pronto!', reg.scope))
        .catch(err => console.log('Erro SW:', err));
    });
  }
</script>

<style>
  :root {
    --bg-main:    #f8fafc;
    --bg-header:  #1e3a8a;
    --bg-card:    #ffffff;
    --bg-input:   #f1f5f9;
    --primary:    #1e3a8a;
    --accent:     #3b82f6;
    --text-main:  #0f172a;
    --
